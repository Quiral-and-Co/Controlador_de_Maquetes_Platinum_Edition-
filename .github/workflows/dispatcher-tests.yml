name: Native Avalonia regression tests

on:
  pull_request:
    branches: [main, "feature/**"]
  push:
    branches: [main, "feature/**", "test/**"]

permissions:
  contents: read

jobs:
  native-regression:
    name: .NET 10 native regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore native test projects
        run: |
          dotnet restore tests/Platinum.Infrastructure.Tests/Platinum.Infrastructure.Tests.csproj
          dotnet restore tests/Platinum.Presentation.Avalonia.Tests/Platinum.Presentation.Avalonia.Tests.csproj

      - name: Build Avalonia presentation
        run: dotnet build src/Platinum.Presentation.Avalonia/Platinum.Presentation.Avalonia.csproj --configuration Release --no-restore

      - name: Infrastructure regression tests
        run: dotnet test tests/Platinum.Infrastructure.Tests/Platinum.Infrastructure.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Avalonia headless and editor regression tests
        run: dotnet test tests/Platinum.Presentation.Avalonia.Tests/Platinum.Presentation.Avalonia.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"
