name: Avalonia .NET 10
on:
  push:
    branches: [ "migration/avalonia-dotnet10-independent" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "Platinum.Avalonia.sln"
      - "src/Platinum.*/**"
      - ".github/workflows/avalonia-dotnet10.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Platinum.Avalonia.sln
      - run: dotnet build Platinum.Avalonia.sln --no-restore --configuration Release
