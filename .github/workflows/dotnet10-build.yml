name: .NET 10 - Build and tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Show SDK
        run: dotnet --info
      - name: Restore solution
        run: dotnet restore Platinum.sln
      - name: Build complete solution
        run: dotnet build Platinum.sln --configuration Release --no-restore
      - name: Run all tests
        run: dotnet test Platinum.sln --configuration Release --no-build --logger "console;verbosity=normal"
